name: Mettre à jour le Pool NHL

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Code source checkout
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécuter le script de mise à jour des statistiques
        run: |
          python update_stats.py

      - name: Publier les modifications sur GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mise à jour automatique du classement Hatch NHL Pool $(date +'%Y-%m-%d')" || exit 0
          git push
