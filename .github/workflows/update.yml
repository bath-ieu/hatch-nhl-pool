name: Mettre à jour les stats du Pool LNH

on:
  schedule:
    - cron: '0 8 * * *' # S'exécute automatiquement tous les jours à 8h00 UTC
  workflow_dispatch: # Permet aussi de lancer la mise à jour manuellement depuis GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécuter le script de mise à jour
        run: python update_pool.py

      - name: Sauvegarder et publier sur GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add pool_data.json
          git commit -m "Mise à jour automatique des statistiques LNH" || exit 0
          git push
