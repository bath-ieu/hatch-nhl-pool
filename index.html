<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatch NHL Pool - Classement</title>
    <style>
        :root {
            --hatch-orange: #EB8328;     /* Orange signature Hatch */
            --bg-color: #121212;         /* Fond sombre moderne */
            --card-bg: #1e1e1e;          /* Fond des cartes / capsules */
            --text-color: #f3f4f6;       /* Texte clair */
            --text-muted: #9ca3af;       /* Texte secondaire */
            --border-color: #2d2d2d;     /* Lignes et bordures */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border-top: 6px solid var(--hatch-orange);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .logo-area h1 {
            margin: 0;
            color: var(--text-color);
            font-size: 1.8rem;
        }
        .logo-area .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 5px;
        }
        .hatch-badge {
            background-color: var(--hatch-orange);
            color: #ffffff;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        
        /* Style des rangs / capsules */
        .standings-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .pool-row {
            display: flex;
            align-items: center;
            background-color: #262626;
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 12px 20px;
            transition: all 0.2s;
        }
        .pool-row:hover {
            border-color: var(--hatch-orange);
            background-color: #2a2a2a;
        }
        .rank-badge {
            min-width: 45px;
            height: 45px;
            border: 2px solid var(--hatch-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--hatch-orange);
            margin-right: 20px;
            background-color: #1a1a1a;
        }
        .participant-info {
            flex-grow: 1;
        }
        .participant-name {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--hatch-orange);
            margin-bottom: 4px;
            cursor: pointer;
            display: inline-block;
        }
        .participant-name:hover {
            text-decoration: underline;
        }
        .categories-grid {
            display: flex;
            gap: 25px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .cat-val {
            color: var(--text-color);
            font-weight: bold;
            margin-top: 2px;
        }
        .total-badge {
            min-width: 80px;
            height: 55px;
            border: 2px solid var(--hatch-orange);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            padding: 0 10px;
        }
        .total-label {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .total-val {
            font-size: 1rem;
            font-weight: bold;
            color: var(--hatch-orange);
        }
        .update-time {
            margin-top: 30px;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Fenêtre Modale (Popup des choix) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #1e1e1e;
            border: 2px solid var(--hatch-orange);
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            margin: 0;
            color: var(--hatch-orange);
            font-size: 1.4rem;
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }
        .close-btn:hover {
            color: var(--hatch-orange);
        }
        .section-title {
            font-size: 1rem;
            color: var(--hatch-orange);
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            font-size: 0.9rem;
            background: #262626;
            padding: 12px;
            border-radius: 8px;
        }
        .roster-item {
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-area">
                <h1>🏒 Hatch NHL Pool</h1>
                <div class="subtitle">Classement officiel du bureau</div>
            </div>
            <div class="hatch-badge">Hatch Ltd</div>
        </div>

        <div class="standings-list" id="pool-standings">
            <!-- Injecté dynamiquement -->
        </div>

        <div class="update-time" id="last-updated">Dernière synchronisation : En attente...</div>
    </div>

    <!-- Modale de détails -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-participant-name">Nom du participant</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-participant-details">
                <!-- Contenu injecté dynamiquement -->
            </div>
        </div>
    </div>

    <script>
        // Données injectées automatiquement par le script Python
        const poolData = /*POOL_DATA_JSON*/;

        function openModal(participantName) {
            const participant = poolData.find(p => p.name === participantName);
            if (!participant) return;

            document.getElementById('modal-participant-name').innerText = participant.name;
            
            let html = `
                <div style="margin-bottom: 15px; color: #9ca3af; font-size: 0.95rem;">
                    <strong>Résumé des points :</strong> Attaquants (${participant.att} pts) | Défenseurs (${participant.def} pts) | Gardiens (${participant.goaler} pts) | Équipes (${participant.equipe} pts) — <strong style="color: #EB8328;">Total : ${participant.total} pts</strong>
                </div>
                <div class="section-title">Équipes sélectionnées</div>
                <div class="roster-grid" style="margin-bottom: 15px;">
                    ${participant.teams.map(t => `<div class="roster-item">🏒 ${t}</div>`).join('')}
                </div>
                <div class="section-title">Alignement des joueurs</div>
                <div class="roster-grid">
                    ${participant.players.map(pl => `<div class="roster-item">• ${pl}</div>`).join('')}
                </div>
            `;

            document.getElementById('modal-participant-details').innerHTML = html;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('playerModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('playerModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
