<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool LNH - Classement en Direct</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 5px solid #ff7b00;
        }
        .rank {
            font-size: 24px;
            font-weight: bold;
            color: #ff7b00;
            width: 40px;
            text-align: center;
        }
        .name {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            flex-grow: 1;
            margin-left: 15px;
        }
        .stats {
            display: flex;
            gap: 20px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }
        .stat-box {
            display: flex;
            flex-direction: column;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .total {
            background: #ff7b00;
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-left: 20px;
            min-width: 80px;
            text-align: center;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #ff7b00;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Classement du Pool LNH</h1>
        <div id="update-time" class="subtitle">Chargement des données...</div>
        <div id="pool-list"></div>
    </div>

    <script>
        async function loadPool() {
            try {
                // Charge le fichier JSON généré automatiquement par le script Python sur GitHub
                const response = await fetch('pool_data.json?' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('update-time').innerText = `Dernière mise à jour : ${data.last_update}`;
                
                const container = document.getElementById('pool-list');
                container.innerHTML = '';
                
                data.participants.sort((a, b) => b.total - a.total);

                data.participants.forEach((p, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="rank">#${index + 1}</div>
                        <div class="name">${p.name}</div>
                        <div class="stats">
                            <div class="stat-box"><span>Att</span><span class="stat-value">${p.att}</span></div>
                            <div class="stat-box"><span>Def</span><span class="stat-value">${p.def}</span></div>
                            <div class="stat-box"><span>Goaler</span><span class="stat-value">${p.goaler}</span></div>
                            <div class="stat-box"><span>Equipe</span><span class="stat-value">${p.equipe}</span></div>
                        </div>
                        <div class="total">${p.total} pts</div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('update-time').innerText = "Erreur de chargement des classements.";
            }
        }
        loadPool();
    </script>
</body>
</html>
