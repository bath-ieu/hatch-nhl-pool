<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool de LNH</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 5px;
        }
        .last-update {
            text-align: center;
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #2b6cb0;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f7fafc;
        }
        .text-right {
            text-align: right;
        }
        .font-bold {
            font-weight: bold;
            color: #2d3748;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: #3182ce;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0;
            text-decoration: underline;
            margin-top: 4px;
        }
        .toggle-btn:hover {
            color: #2b6cb0;
        }
        .details-row {
            display: none;
            background-color: #f8fafc;
        }
        .details-content {
            padding: 15px 20px;
            font-size: 0.85rem;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
        }
        .details-section {
            margin-bottom: 10px;
        }
        .details-section h4 {
            margin: 0 0 5px 0;
            color: #2d3748;
            font-size: 0.9rem;
            border-bottom: 1px dashed #cbd5e0;
            padding-bottom: 2px;
        }
        .badge {
            display: inline-block;
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 2px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Classement du Pool de LNH</h1>
    <div class="last-update" id="last-update">Chargement de la dernière mise à jour...</div>

    <table>
        <thead>
            <tr>
                <th>Participant</th>
                <th class="text-right">Att.</th>
                <th class="text-right">Déf.</th>
                <th class="text-right">Gard.</th>
                <th class="text-right">Équipes</th>
                <th class="text-right">Total</th>
            </tr>
        </thead>
        <tbody id="standings-body">
            <!-- Inséré dynamiquement par JavaScript -->
        </tbody>
    </table>
</div>

<script>
async function loadPoolData() {
    try {
        const response = await fetch('pool_data.json');
        const data = await response.json();

        document.getElementById('last-update').innerText = `Dernière mise à jour : ${data.last_update}`;
        
        const tbody = document.getElementById('standings-body');
        tbody.innerHTML = '';

        // Trier par total de points décroissant
        data.participants.sort((a, b) => b.total - a.total);

        data.participants.forEach((p, index) => {
            // Ligne principale du participant
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <span class="font-bold">#${index + 1} ${p.name}</span><br>
                    <button class="toggle-btn" onclick="toggleDetails(${index})">Voir l'alignement & stats</button>
                </td>
                <td class="text-right">${p.att}</td>
                <td class="text-right">${p.def}</td>
                <td class="text-right">${p.goaler}</td>
                <td class="text-right">${p.equipe}</td>
                <td class="text-right font-bold" style="color: #2b6cb0; font-size: 1.1rem;">${p.total}</td>
            `;
            tbody.appendChild(row);

            // Ligne détaillée (cachée par défaut)
            const detailsRow = document.createElement('tr');
            detailsRow.className = 'details-row';
            detailsRow.id = `details-${index}`;

            let playersHtml = p.roster_details.players.map(pl => 
                `<span class="badge">${pl.name} (${pl.position}) : ${pl.goals}B, ${pl.assists}A = <strong>${pl.points} pts</strong></span>`
            ).join(' ');

            let goaliesHtml = p.roster_details.goalies.map(g => 
                `<span class="badge">${g.name} (G) : ${g.goals}B, ${g.assists}A = <strong>${g.points} pts</strong></span>`
            ).join(' ');

            let teamsHtml = p.roster_details.teams.map(t => 
                `<span class="badge">${t.name} : ${t.rw} RW, ${t.row} ROW, ${t.otl} OTL = <strong>${t.points} pts</strong></span>`
            ).join(' ');

            detailsRow.innerHTML = `
                <td colspan="6" style="padding: 0;">
                    <div class="details-content">
                        <div class="details-section">
                            <h4>Joueurs (Attaquants & Défenseurs)</h4>
                            <div>${playersHtml}</div>
                        </div>
                        <div class="details-section">
                            <h4>Gardiens</h4>
                            <div>${goaliesHtml}</div>
                        </div>
                        <div class="details-section">
                            <h4>Équipes</h4>
                            <div>${teamsHtml}</div>
                        </div>
                    </div>
                </td>
            `;
            tbody.appendChild(detailsRow);
        });

    } catch (error) {
        console.error("Erreur lors du chargement des données du pool:", error);
        document.getElementById('last-update').innerText = "Erreur de chargement de pool_data.json";
    }
}

function toggleDetails(index) {
    const row = document.getElementById(`details-${index}`);
    if (row.style.display === 'table-row') {
        row.style.display = 'none';
    } else {
        row.style.display = 'table-row';
    }
}

loadPoolData();
</script>

</body>
</html>
